{% macro icon(name, size=20) -%}
<svg class="erp-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
{% elif name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'project' %}<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 12h8m-8 4h5"/>
{% elif name == 'form' %}<rect x="5" y="4" width="14" height="18" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M9 11h6m-6 4h6m-6 4h3"/>
{% elif name == 'users' %}<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m1-17a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5v2"/>
{% elif name == 'briefcase' %}<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 12l9 3 9-3m-9 1v3"/>
{% elif name == 'box' %}<path d="m12 3 9 5v9l-9 5-9-5V8zM3 8l9 5 9-5m-9 5v9M7.5 5.5l9 5"/>
{% elif name == 'wallet' %}<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M16 10h5v6h-5a3 3 0 0 1 0-6zM3 8h18"/><circle cx="17" cy="13" r=".7"/>
{% elif name == 'chart' %}<path d="M4 3v17h17M8 16v-4m5 4V8m5 8V5"/>
{% elif name == 'spark' %}<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>
{% elif name == 'settings' %}<circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1v4l-2 1 2 1v4l3 1 1 3h6l1-3 3-1v-4l2-1-2-1V7l-3-1-1-3z"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'star' %}<path d="m12 3 3 6 6 1-4.5 4.5 1 6.5-5.5-3-5.5 3 1-6.5L3 10l6-1z"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'arrow' %}<path d="M5 12h14m-5-5 5 5-5 5"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'bell' %}<path d="M6 8a6 6 0 0 1 12 0v7l2 3H4l2-3zm4 13h4"/>
{% elif name == 'water' %}<path d="M12 2S5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13zM9 15a3 3 0 0 0 3 3"/>
{% else %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3h.01"/>{% endif %}
</svg>
{%- endmacro %}
