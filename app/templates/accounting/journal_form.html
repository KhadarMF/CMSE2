{% extends "base.html" %}
{% block content %}
<div class="mt-4 mb-3">
  <h2 class="fw-bold">New Journal Entry</h2>
  <p class="text-muted mb-0">All amounts in USD. Debits must equal credits before the entry can be posted.</p>
</div>

<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card shadow-sm mb-4" style="max-width: 720px;">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Date <span class="text-danger">*</span></label>
          <input class="form-control" type="date" name="entry_date" value="{{ today }}" required>
        </div>
        <div class="col-md-8">
          <label class="form-label">Reference</label>
          <input class="form-control" type="text" name="reference" placeholder="Receipt no, invoice no...">
        </div>
        <div class="col-12">
          <label class="form-label">Memo</label>
          <input class="form-control" type="text" name="memo" placeholder="What is this entry for?">
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-header bg-white fw-bold">Lines</div>
    <div class="card-body p-0">
      <table class="table mb-0 align-middle" id="linesTable">
        <thead><tr><th style="min-width:260px;">Account</th><th>Description</th><th style="width:140px;">Debit</th><th style="width:140px;">Credit</th><th style="width:50px;"></th></tr></thead>
        <tbody id="linesBody"></tbody>
        <tfoot>
          <tr class="fw-bold table-light">
            <td colspan="2">Totals</td>
            <td><span id="totalDebit">0.00</span></td>
            <td><span id="totalCredit">0.00</span></td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center">
      <button class="btn btn-sm btn-outline-dark" type="button" onclick="addLine()">+ Add Line</button>
      <span id="balanceStatus" class="small"></span>
    </div>
  </div>

  <div class="d-flex gap-2 mb-4">
    <button class="btn btn-success" type="submit" name="action" value="post" id="postBtn">Post Entry</button>
    <button class="btn btn-outline-primary" type="submit" name="action" value="draft">Save as Draft</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('accounting.journal') }}">Cancel</a>
  </div>
</form>

<template id="lineTemplate">
  <tr>
    <td>
      <select class="form-select form-select-sm" name="line_account_id">
        <option value="">— Select account —</option>
        {% for a in accounts %}<option value="{{ a.id }}">{{ a.code }} {{ a.name }}</option>{% endfor %}
      </select>
    </td>
    <td><input class="form-control form-control-sm" type="text" name="line_description"></td>
    <td><input class="form-control form-control-sm text-end amt" type="number" step="0.01" min="0" name="line_debit" oninput="recalc()"></td>
    <td><input class="form-control form-control-sm text-end amt" type="number" step="0.01" min="0" name="line_credit" oninput="recalc()"></td>
    <td><button class="btn btn-sm btn-outline-danger" type="button" onclick="this.closest('tr').remove(); recalc();">×</button></td>
  </tr>
</template>

<script>
function addLine() {
  var tpl = document.getElementById('lineTemplate');
  document.getElementById('linesBody').appendChild(tpl.content.cloneNode(true));
}
function recalc() {
  var d = 0, c = 0;
  document.querySelectorAll('#linesBody input[name="line_debit"]').forEach(function (el) { d += parseFloat(el.value) || 0; });
  document.querySelectorAll('#linesBody input[name="line_credit"]').forEach(function (el) { c += parseFloat(el.value) || 0; });
  document.getElementById('totalDebit').textContent = d.toFixed(2);
  document.getElementById('totalCredit').textContent = c.toFixed(2);
  var status = document.getElementById('balanceStatus');
  var postBtn = document.getElementById('postBtn');
  if (d === 0 && c === 0) { status.textContent = ''; postBtn.disabled = true; return; }
  if (Math.abs(d - c) < 0.005) {
    status.textContent = 'Balanced ✓';
    status.className = 'small text-success';
    postBtn.disabled = false;
  } else {
    status.textContent = 'Out of balance by ' + Math.abs(d - c).toFixed(2);
    status.className = 'small text-danger';
    postBtn.disabled = true;
  }
}
addLine(); addLine();
recalc();
</script>
{% endblock %}
