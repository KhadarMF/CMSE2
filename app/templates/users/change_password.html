{% extends "base.html" %}{% block content %}<div class="mt-4 mb-3"><h2 class="fw-bold">Change Password</h2><p class="text-muted">{{ user.full_name }} — {{ user.email }}</p></div><div class="card shadow-sm"><div class="card-body"><form method="POST" autocomplete="off" data-erp-admin-password-form="true">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="text" name="erp_target_user" value="{{ user.email }}" autocomplete="off" tabindex="-1" aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px;opacity:0;"><div class="mb-3"><label class="form-label" for="newUserPassword">New ERP Password</label><input type="password" class="form-control" id="newUserPassword" name="new_user_password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore required></div><div class="mb-3"><label class="form-label" for="confirmUserPassword">Confirm ERP Password</label><input type="password" class="form-control" id="confirmUserPassword" name="confirm_user_password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore required></div><button class="btn btn-primary">Change Password</button><a class="btn btn-light" href="{{ url_for('users.list_users') }}">Cancel</a></form></div></div>{% endblock %}
